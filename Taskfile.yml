---
version: "3"

vars:
  # Local builds default to the same channel used by the development laptop.
  IMAGE: '{{default "localhost/cabby-atomic" .IMAGE}}'
  TAG: '{{default "testing" .TAG}}'
  BASE_IMAGE: '{{default "ghcr.io/ublue-os/kinoite-main:latest" .BASE_IMAGE}}'
  REMOTE_IMAGE: '{{default "ghcr.io/washkinazy/cabby-atomic" .REMOTE_IMAGE}}'
  REMOTE_TAG: '{{default .TAG .REMOTE_TAG}}'
  DIGEST_FILE: '{{default "/tmp/cabby-atomic-digest" .DIGEST_FILE}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - '{{.TASK_EXE}} --list'

  build:
    desc: Build the local bootc image
    preconditions:
      - sh: command -v podman >/dev/null 2>&1
        msg: Podman is required to build the image.
    env:
      IMAGE: "{{.IMAGE}}"
      TAG: "{{.TAG}}"
      BASE_IMAGE: "{{.BASE_IMAGE}}"
    cmds:
      - ./scripts/build-image.sh

  validate:
    desc: Run Cabby Atomic smoke tests against a built image
    preconditions:
      - sh: command -v podman >/dev/null 2>&1
        msg: Podman is required to validate the image.
      - sh: podman image exists "{{.IMAGE}}:{{.TAG}}"
        msg: Build the image with `task build` before validating it.
    env:
      IMAGE: "{{.IMAGE}}"
      TAG: "{{.TAG}}"
    cmds:
      - ./scripts/validate-image.sh

  publish:
    desc: Push the built image to its remote channel
    preconditions:
      - sh: command -v podman >/dev/null 2>&1
        msg: Podman is required to publish the image.
    env:
      IMAGE: "{{.IMAGE}}"
      TAG: "{{.TAG}}"
      REMOTE_IMAGE: "{{.REMOTE_IMAGE}}"
      REMOTE_TAG: "{{.REMOTE_TAG}}"
      DIGEST_FILE: "{{.DIGEST_FILE}}"
    cmds:
      - ./scripts/publish-image.sh

  sign:
    desc: Sign and verify a published image digest
    preconditions:
      - sh: command -v cosign >/dev/null 2>&1
        msg: Cosign is required to sign the image.
      - sh: test -f cosign.pub
        msg: cosign.pub is required to verify the signature.
    env:
      REMOTE_IMAGE: "{{.REMOTE_IMAGE}}"
    cmds:
      - ./scripts/sign-image.sh

  verify-policy:
    desc: Verify a published image through the installed signature policy
    preconditions:
      - sh: command -v skopeo >/dev/null 2>&1
        msg: Skopeo is required to verify the containers policy.
      - sh: command -v podman >/dev/null 2>&1
        msg: Podman is required to clean up the verification image.
    env:
      REMOTE_IMAGE: "{{.REMOTE_IMAGE}}"
      DIGEST: "{{.DIGEST}}"
    cmds:
      - ./scripts/verify-policy.sh
