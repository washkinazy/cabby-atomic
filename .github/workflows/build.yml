---
name: Build container image

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches:
      - main
      - testing
  push:
    branches:
      - main
      - testing
    paths-ignore:
      - "**/README.md"
  schedule:
    # Rebuild main every Sunday at 09:17 UTC to pick up the upstream stack.
    - cron: "17 9 * * 0"
    # Rebuild testing daily at 10:17 UTC so it receives upstream changes first.
    - cron: "17 10 * * *"
  workflow_dispatch:

concurrency:
  # Keep the main and testing timers independent even though GitHub schedules
  # both from the default branch's workflow definition.
  # yamllint disable-line rule:line-length
  group: ${{ github.workflow }}-${{ github.event.schedule || github.ref || github.run_id }}
  cancel-in-progress: true

env:
  LOCAL_IMAGE: localhost/cabby-atomic
  REMOTE_IMAGE: ghcr.io/${{ github.repository_owner }}/cabby-atomic
  DIGEST_FILE: /tmp/cabby-atomic-digest

jobs:
  build:
    name: Build ${{ matrix.variant }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            base_image: ghcr.io/ublue-os/kinoite-main:44
            tag_suffix: ""
          - variant: nvidia
            base_image: ghcr.io/ublue-os/kinoite-nvidia:44
            tag_suffix: -nvidia

    steps:
      - name: Select build channel and ref
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          build_ref=""

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              channel="pr-${PR_NUMBER}"
              ;;
            schedule)
              case "${SCHEDULE}" in
                "17 9 * * 0")
                  channel="main"
                  build_ref="main"
                  ;;
                "17 10 * * *")
                  channel="testing"
                  build_ref="testing"
                  ;;
                *)
                  printf 'Unknown schedule: %s\n' "${SCHEDULE}" >&2
                  exit 1
                  ;;
              esac
              ;;
            push | workflow_dispatch)
              channel="${GITHUB_REF_NAME}"
              ;;
            *)
              printf 'Unsupported event: %s\n' "${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          suffix="${{ matrix.tag_suffix }}"
          immutable_tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}${suffix}"
          echo "BUILD_REF=${build_ref}" >> "${GITHUB_ENV}"
          echo "CHANNEL=${channel}" >> "${GITHUB_ENV}"
          echo "IMAGE_TAG=${channel}${suffix}" >> "${GITHUB_ENV}"
          echo "IMMUTABLE_TAG=${immutable_tag}" >> "${GITHUB_ENV}"

      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Scheduled workflows originate on the default branch. The explicit
          # ref makes the daily testing job build testing's actual contents.
          ref: ${{ env.BUILD_REF }}

      - name: Free build space
        # yamllint disable-line rule:line-length
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.48.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: >-
          task build
          IMAGE="${LOCAL_IMAGE}"
          TAG="${IMAGE_TAG}"
          BASE_IMAGE="${{ matrix.base_image }}"
          IMAGE_VARIANT="${{ matrix.variant }}"

      - name: Validate image
        run: task validate IMAGE="${LOCAL_IMAGE}" TAG="${IMAGE_TAG}"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        # yamllint disable-line rule:line-length
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable build
        if: github.event_name != 'pull_request'
        run: >-
          task publish
          IMAGE="${LOCAL_IMAGE}"
          TAG="${IMAGE_TAG}"
          REMOTE_IMAGE="${REMOTE_IMAGE}"
          REMOTE_TAG="${IMMUTABLE_TAG}"
          DIGEST_FILE="${DIGEST_FILE}"

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        # yamllint disable-line rule:line-length
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Sign and verify image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail
          export DIGEST
          DIGEST="$(<"${DIGEST_FILE}")"
          task sign REMOTE_IMAGE="${REMOTE_IMAGE}"

      - name: Verify installed signature policy
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          export DIGEST
          DIGEST="$(<"${DIGEST_FILE}")"
          task verify-policy REMOTE_IMAGE="${REMOTE_IMAGE}"

      - name: Publish channel
        if: github.event_name != 'pull_request'
        run: >-
          task publish
          IMAGE="${LOCAL_IMAGE}"
          TAG="${IMAGE_TAG}"
          REMOTE_IMAGE="${REMOTE_IMAGE}"
          REMOTE_TAG="${IMAGE_TAG}"
          DIGEST_FILE="${DIGEST_FILE}"
